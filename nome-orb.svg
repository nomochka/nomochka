<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-label="Nome AI morphing orb">

  <defs>
    <!-- Ядро: радиальный градиент -->
    <radialGradient id="coreGrad" cx="50%" cy="42%" r="62%">
      <stop offset="0%"   stop-color="#a5f3fc"/>
      <stop offset="30%"  stop-color="#22d3ee"/>
      <stop offset="55%"  stop-color="#0ea5e9"/>
      <stop offset="80%"  stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </radialGradient>

    <!-- Блик -->
    <radialGradient id="highlightGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Внешнее свечение -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="55%"  stop-color="#0ea5e9" stop-opacity="0"/>
      <stop offset="80%"  stop-color="#0ea5e9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <!-- Размытие для свечения -->
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- ЖИДКАЯ ЭРОЗИЯ — то, что делает края «живыми» -->
    <filter id="liquid-erosion" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.015 0.02"
                    numOctaves="2"
                    seed="7"
                    result="noise">
        <animate attributeName="baseFrequency"
                 dur="9s"
                 values="0.015 0.02; 0.032 0.012; 0.018 0.028; 0.015 0.02"
                 repeatCount="indefinite"/>
      </feTurbulence>

      <feDisplacementMap in="SourceGraphic"
                         in2="noise"
                         scale="16"
                         xChannelSelector="R"
                         yChannelSelector="G">
        <animate attributeName="scale"
                 dur="6s"
                 values="16; 24; 18; 16"
                 repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>
  </defs>

  <!-- Внешнее пульсирующее свечение -->
  <circle cx="100" cy="100" r="88"
          fill="url(#glowGrad)"
          filter="url(#softGlow)">
    <animate attributeName="r"
             dur="3.2s"
             values="84; 92; 84"
             repeatCount="indefinite"/>
  </circle>

  <!-- Морфящийся шар -->
  <g filter="url(#liquid-erosion)">

    <!-- Тело шара (меняет форму) -->
    <path fill="url(#coreGrad)">
      <animate attributeName="d"
               dur="6s"
               repeatCount="indefinite"
               calcMode="spline"
               keyTimes="0; 0.25; 0.5; 0.75; 1"
               keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
               values="
                 M 100 20
                 C 145 20, 180 55, 180 100
                 C 180 145, 145 180, 100 180
                 C 55 180, 20 145, 20 100
                 C 20 55, 55 20, 100 20 Z;

                 M 106 24
                 C 150 22, 176 58, 174 104
                 C 172 152, 138 178, 96 176
                 C 54 174, 24 142, 26 96
                 C 28 52, 62 26, 106 24 Z;

                 M 94 22
                 C 142 26, 178 52, 176 102
                 C 174 150, 138 174, 98 178
                 C 56 180, 22 148, 22 100
                 C 22 54, 52 18, 94 22 Z;

                 M 103 20
                 C 148 24, 178 56, 178 102
                 C 178 148, 142 176, 100 178
                 C 58 180, 22 146, 22 100
                 C 22 54, 56 18, 103 20 Z;

                 M 100 20
                 C 145 20, 180 55, 180 100
                 C 180 145, 145 180, 100 180
                 C 55 180, 20 145, 20 100
                 C 20 55, 55 20, 100 20 Z
               "/>
    </path>

    <!-- Блик (движется вместе с формой) -->
    <ellipse cx="76" cy="72" rx="24" ry="16"
             fill="url(#highlightGrad)"
             opacity="0.55">
      <animate attributeName="cx"
               dur="6s"
               values="76; 82; 72; 78; 76"
               repeatCount="indefinite"/>
      <animate attributeName="cy"
               dur="6s"
               values="72; 68; 78; 70; 72"
               repeatCount="indefinite"/>
    </ellipse>

  </g>
</svg>*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.stage {
  width: 800px;
  height: 290px;
  background:
    radial-gradient(
      ellipse at 50% 42%,
      rgba(14, 165, 233, 0.22) 0%,
      rgba(3, 105, 161, 0.08) 45%,
      transparent 72%
    ),
    #0d1117;
  border: 1px solid rgba(56, 189, 248, 0.16);
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  position: relative;
}

.orb-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 18px;
  /* filter: url(#liquid-erosion); — УДАЛЕНО: вызывает "Invalid image source" */
}

.nome-ai-orb {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 108px;
  height: 108px;
  border-radius: 50%;
  isolation: isolate;
  --orb-shadow: rgba(14, 165, 233, 0.85);
}

.nome-ai-orb::before {
  content: "";
  position: absolute;
  inset: 2px;
  border-radius: 42% 58% 63% 37% / 45% 42% 58% 55%;
  background: conic-gradient(
    from 0deg,
    #0369a1,
    #0ea5e9,
    #a5f3fc,
    #0284c7,
    #22d3ee,
    #075985,
    #0369a1
  );
  filter: blur(1.8px) contrast(1.38);
  animation: orbMorphSpin 4s linear infinite;
  box-shadow:
    0 0 38px var(--orb-shadow),
    0 0 75px rgba(2, 132, 199, 0.4),
    inset 0 0 16px rgba(165, 243, 252, 0.65);
}

.nome-ai-orb::after {
  content: "";
  position: absolute;
  inset: -14px;
  border-radius: 58% 42% 38% 62% / 53% 60% 40% 47%;
  background: conic-gradient(
    from 180deg,
    transparent 0deg,
    rgba(14, 165, 233, 0.9) 70deg,
    transparent 140deg,
    rgba(34, 211, 238, 0.85) 230deg,
    transparent 310deg
  );
  filter: blur(8px);
  mix-blend-mode: screen;
  animation:
    orbErodeReverse 2.4s ease-in-out infinite alternate,
    orbSpinReverse 4.5s linear infinite;
}

.brand {
  font-size: 38px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: #ffffff;
  line-height: 1.1;
}

.brand span {
  background: linear-gradient(120deg, #a5f3fc, #38bdf8 55%, #0284c7);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  font-weight: 400;
  margin-left: 6px;
}

.sub {
  margin-top: 8px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11.5px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(165, 243, 252, 0.72);
}

@keyframes orbMorphSpin {
  0% {
    transform: rotate(0deg) scale(0.95);
    border-radius: 42% 58% 63% 37% / 45% 42% 58% 55%;
  }
  33% {
    transform: rotate(120deg) scale(1.06) skewX(4deg);
    border-radius: 58% 42% 45% 55% / 58% 55% 45% 42%;
  }
  66% {
    transform: rotate(240deg) scale(0.92) skewY(-4deg);
    border-radius: 38% 62% 55% 45% / 42% 58% 42% 58%;
  }
  100% {
    transform: rotate(360deg) scale(0.95);
    border-radius: 42% 58% 63% 37% / 45% 42% 58% 55%;
  }
}

@keyframes orbSpinReverse {
  0% {
    transform: rotate(360deg) scale(1.08);
  }
  50% {
    transform: rotate(180deg) scale(0.88);
  }
  100% {
    transform: rotate(0deg) scale(1.08);
  }
}

@keyframes orbErodeReverse {
  0% {
    opacity: 0.65;
    filter: blur(6px) hue-rotate(0deg);
  }
  100% {
    opacity: 1;
    filter: blur(9px) hue-rotate(15deg);
  }
}
