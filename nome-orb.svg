<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%">
  <defs>
    <!-- Оригинальный фильтр жидкого разъедания краёв -->
    <filter id="liquid-erosion" filterUnits="userSpaceOnUse" x="250" y="-10" width="300" height="230">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" result="noise" seed="2" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="22" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <filter id="soft-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" />
    </filter>

    <filter id="core-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" />
    </filter>

    <!-- Фоновое свечение сцены -->
    <radialGradient id="bg-glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#0369a1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>

    <!-- Градиент ядра шара (orb-mode-ocean) -->
    <linearGradient id="ocean-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="28%" stop-color="#22d3ee" />
      <stop offset="55%" stop-color="#0ea5e9" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Вторичный градиент волн эрозии -->
    <linearGradient id="ocean-wave" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.85" />
    </linearGradient>

    <!-- Внутренний блик -->
    <radialGradient id="inner-Spec" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>

    <!-- Градиент текста AI -->
    <linearGradient id="ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 36px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
      font-weight: 600;
      fill: #7dd3fc;
       fill-opacity: 0.78;
      letter-spacing: 3.2px;
    }
    .orb-core {
      transform-origin: 0px 0px;
      animation: orbMorphSpin 4s linear infinite;
    }
    .orb-erosion-outer {
      transform-origin: 0px 0px;
      animation: orbSpinReverse 4.5s linear infinite;
    }
    .orb-erosion-wave {
      transform-origin: 0px 0px;
      animation: orbWave 2.6s ease-in-out infinite alternate;
    }
    .ambient-pulse {
      transform-origin: 400px 102px;
      animation: pulseGlow 3.5s ease-in-out infinite alternate;
    }
    @keyframes orbMorphSpin {
      0%   { transform: rotate(0deg) scale(0.95, 1.04) skewX(0deg); }
      33%  { transform: rotate(120deg) scale(1.06, 0.94) skewX(5deg); }
      66%  { transform: rotate(240deg) scale(0.93, 1.05) skewY(-5deg); }
      100% { transform: rotate(360deg) scale(0.95, 1.04) skewX(0deg); }
    }
    @keyframes orbSpinReverse {
      0%   { transform: rotate(360deg) scale(1.08, 0.94); }
      50%  { transform: rotate(180deg) scale(0.90, 1.10); }
      100% { transform: rotate(0deg) scale(1.08, 0.94); }
    }
    @keyframes orbWave {
      0%   { transform: rotate(-25deg) scale(0.92, 1.08); opacity: 0.7; }
      100% { transform: rotate(35deg) scale(1.10, 0.92); opacity: 1; }
    }
    @keyframes pulseGlow {
      0%   { transform: scale(0.94); opacity: 0.75; }
      100% { transform: scale(1.08); opacity: 1; }
    }
  </style>

  <!-- Подложка баннера -->
  <rect width="800" height="280" rx="16" fill="#0d1117" />
  <rect width="800" height="280" rx="16" fill="url(#bg-glow)" class="ambient-pulse" />
  <rect x="0.75" y="0.75" width="798.5" height="278.5" rx="15.25" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Мягкое внешнее свечение позади шара -->
  <circle cx="400" cy="102" r="64" fill="#0ea5e9" fill-opacity="0.22" filter="url(#soft-blur)" class="ambient-pulse" />

  <!-- Жидкий шар Nome AI строго по центру (400, 102) -->
  <g filter="url(#liquid-erosion)">
    <g transform="translate(400, 102)">
      <!-- Внешний ореол эрозии -->
      <ellipse class="orb-erosion-outer" cx="0" cy="0" rx="58" ry="48" fill="url(#ocean-wave)" filter="url(#soft-blur)" />
      <ellipse class="orb-erosion-wave" cx="0" cy="0" rx="46" ry="56" fill="url(#ocean-wave)" filter="url(#core-blur)" />

      <!-- Основное жидкое ядро -->
      <ellipse class="orb-core" cx="0" cy="0" rx="48" ry="44" fill="url(#ocean-core)" filter="url(#core-blur)" />

      <!-- Внутренний каустический блик -->
      <ellipse class="orb-erosion-outer" cx="-8" cy="-8" rx="36" ry="32" fill="url(#inner-Spec)" />
    </g>
  </g>

  <!-- Текст строго по центру (text-anchor="middle") -->
  <text x="400" y="218" text-anchor="middle" class="title">
    Nome <tspan fill="url(#ai-grad)" font-weight="400">AI</tspan>
  </text>
  <text x="400" y="246" text-anchor="middle" class="subtitle">
    ML ENGINEER // AI RESEARCHER // BACKEND DEVELOPER
  </text>
</svg>