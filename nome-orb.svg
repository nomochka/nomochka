<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="100%">
  <defs>
    <!-- Жидкое разъедание краёв -->
    <filter id="liquid-erosion" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blurred" />
      <feColorMatrix in="blurred" type="matrix" values="1.35 0    0    0 -0.12
                0    1.35 0    0 -0.12
                0    0    1.45 0 -0.10
                0    0    0    1.6 -0.25" result="contrasted" />
      <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="3" seed="2" result="noise">
        <animate attributeName="baseFrequency" values="0.028;0.042;0.028" dur="5.5s" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="contrasted" in2="noise" scale="24" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0ea5e9" flood-opacity="0.65" />
    </filter>

    <filter id="glow-heavy" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28" />
    </filter>

    <filter id="glow-line" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Сетка фона -->
    <pattern id="cyber-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.12" />
      <circle cx="36" cy="36" r="1" fill="#7dd3fc" fill-opacity="0.25" />
    </pattern>

    <radialGradient id="grid-fade" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <mask id="grid-mask">
      <rect width="920" height="370" fill="url(#grid-fade)" />
    </mask>

    <!-- Градиенты шара -->
    <radialGradient id="orb-base" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="30%" stop-color="#22d3ee" />
      <stop offset="62%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </radialGradient>

    <linearGradient id="lobe-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="lobe-deep" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="55%" stop-color="#075985" />
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="lobe-bright" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#a5f3fc" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <!-- Liquid Glass карточки -->
    <linearGradient id="glass-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.06" />
    </linearGradient>

    <linearGradient id="glass-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="ecg-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a5f3fc" stop-opacity="1" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="920" height="370" rx="20" fill="#04080f" />

  <!-- Световые пятна -->
  <circle cx="230" cy="110" r="160" fill="#1c56cd" fill-opacity="0.22" filter="url(#glow-heavy)">
    <animate attributeName="cx" values="230;265;230" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle cx="690" cy="260" r="150" fill="#0ea5e9" fill-opacity="0.18" filter="url(#glow-heavy)">
    <animate attributeName="cx" values="690;655;690" dur="14s" repeatCount="indefinite" />
  </circle>

  <!-- Сетка -->
  <rect width="920" height="370" rx="20" fill="url(#cyber-grid)" mask="url(#grid-mask)" />

  <!-- Вордмарк -->
  <text x="460" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#7dd3fc" fill-opacity="0.45" letter-spacing="6">
    NOME SERVICES // ARCHITECTURE
  </text>

  <!-- Боковые карточки (левая колонка) -->
  <g transform="translate(36, 60)">
    <rect width="236" height="66" rx="14" fill="url(#glass-fill)" stroke="url(#glass-stroke)" stroke-width="1" />
    <rect x="14" y="17" width="3" height="32" rx="1.5" fill="#38bdf8" />
    <text x="28" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#38bdf8" letter-spacing="1.6">
      ML & DEEP LEARNING
    </text>
    <text x="28" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">
      PyTorch · NLP · LightGBM
    </text>
  </g>

  <g transform="translate(36, 140)">
    <rect width="236" height="66" rx="14" fill="url(#glass-fill)" stroke="url(#glass-stroke)" stroke-width="1" />
    <rect x="14" y="17" width="3" height="32" rx="1.5" fill="#22d3ee" />
    <text x="28" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#67e8f9" letter-spacing="1.6">
      RESEARCH & METRICS
    </text>
    <text x="28" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">
      OOF CV · Ensembling · F2
    </text>
  </g>

  <!-- Боковые карточки (правая колонка) -->
  <g transform="translate(648, 60)">
    <rect width="236" height="66" rx="14" fill="url(#glass-fill)" stroke="url(#glass-stroke)" stroke-width="1" />
    <rect x="14" y="17" width="3" height="32" rx="1.5" fill="#38bdf8" />
    <text x="28" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#38bdf8" letter-spacing="1.6">
      HIGH-LOAD BACKEND
    </text>
    <text x="28" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">
      Python · Java · Spring Boot
    </text>
  </g>

  <g transform="translate(648, 140)">
    <rect width="236" height="66" rx="14" fill="url(#glass-fill)" stroke="url(#glass-stroke)" stroke-width="1" />
    <rect x="14" y="17" width="3" height="32" rx="1.5" fill="#22d3ee" />
    <text x="28" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#67e8f9" letter-spacing="1.6">
      INFRASTRUCTURE
    </text>
    <text x="28" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">
      FastAPI · PostgreSQL · Docker
    </text>
  </g>

  <!-- Центральный жидкий шар (460, 126) -->
  <g transform="translate(460, 126)" filter="url(#liquid-erosion)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4.6s" repeatCount="indefinite" />
      <path d="M 0,-56 C 34,-54 58,-30 54,4 C 50,38 26,60 -8,54 C -42,48 -60,22 -54,-10 C -48,-42 -34,-58 0,-56 Z" fill="url(#lobe-cyan)" opacity="0.85" />
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.4s" repeatCount="indefinite" />
      <path d="M 0,-50 C 30,-52 52,-26 50,6 C 48,38 22,52 -10,48 C -42,44 -54,18 -48,-12 C -42,-42 -30,-48 0,-50 Z" fill="url(#orb-base)" />
      <path d="M -10,-44 C 20,-50 48,-20 42,12 C 36,44 4,48 -22,38 C -48,28 -46,-8 -32,-30 C -22,-44 -10,-44 -10,-44 Z" fill="url(#lobe-deep)" />
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="2.7s" repeatCount="indefinite" />
      <path d="M -5,-38 C 22,-40 40,-16 34,10 C 28,36 2,40 -20,30 C -42,20 -38,-10 -22,-28 C -12,-38 -5,-38 -5,-38 Z" fill="url(#lobe-bright)" />
    </g>
    <circle cx="-10" cy="-12" r="18" fill="#e0f2fe" fill-opacity="0.55">
      <animate attributeName="r" values="15;21;15" dur="2.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ЭКГ линия -->
  <g transform="translate(330, 210)" filter="url(#glow-line)">
    <path d="M0 18 H85 L95 10 L105 26 L118 3 L130 33 L140 14 L148 18 H260" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M0 18 H85 L95 10 L105 26 L118 3 L130 33 L140 14 L148 18 H260" fill="none" stroke="url(#ecg-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="320" stroke-dashoffset="320">
      <animate attributeName="stroke-dashoffset" values="320;0;-320" dur="3.4s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Текст: только nome (другой чистый техно-шрифт, без AI) -->
  <text x="460" y="286" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, sans-serif" font-size="46" font-weight="900" fill="url(#title-grad)" letter-spacing="1">
    nome
  </text>

  <text x="460" y="318" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#7dd3fc" fill-opacity="0.8" letter-spacing="3.5">
    ML ENGINEER  //  AI RESEARCHER  //  BACKEND DEVELOPER
  </text>

  <!-- Внешняя рамка -->
  <rect x="0.75" y="0.75" width="918.5" height="368.5" rx="19.25" fill="none" stroke="url(#glass-stroke)" stroke-width="1.5" />
</svg>